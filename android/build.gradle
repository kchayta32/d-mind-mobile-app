// Top-level build file where you can add configuration options common to all sub-projects/modules.
// ไฟล์คอนฟิกูเรชันระดับบนสุด (Top-level) สำหรับแชร์การตั้งค่าระหว่างโปรเจกต์ย่อยหรือโมดูลทั้งหมด

// กำหนดการตั้งค่าสำหรับการทำงานของระบบ Build (Gradle plugins และ Dependencies)
buildscript {

    // แหล่งจัดเก็บไลบรารีและปลั๊กอินสำหรับ Build Script
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    // ปลั๊กอินเสริมที่จำเป็นในขั้นตอนการสร้างแอปพลิเคชัน
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.21'
        classpath 'org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:2.3.21'
        classpath 'org.jetbrains.kotlin:kotlin-serialization:2.3.21'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

// กำหนดไดเรกทอรีชั่วคราวสำหรับ SQLite JDBC / Room compiler เพื่อป้องกันปัญหา C:\WINDOWS\ บน Windows
def sqliteTmpDir = new File(rootDir, ".gradle/tmp/sqlite")
if (!sqliteTmpDir.exists()) {
    sqliteTmpDir.mkdirs()
}
System.setProperty("org.sqlite.tmpdir", sqliteTmpDir.absolutePath)
def sysTmp = System.getProperty("java.io.tmpdir")
if (sysTmp == null || sysTmp.toLowerCase().contains("windows") || !new File(sysTmp).canWrite()) {
    System.setProperty("java.io.tmpdir", sqliteTmpDir.absolutePath)
}

// โหลดตัวแปรและค่าคอนฟิกูเรชันร่วมจากไฟล์ variables.gradle
apply from: "variables.gradle"

// กำหนดการตั้งค่าที่ใช้ร่วมกันในทุกโปรเจกต์ย่อย (Sub-projects)
allprojects {
    // แหล่งดาวน์โหลดไลบรารีสำหรับการพัฒนาแอปพลิเคชัน
    repositories {
        google()
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        if (options.forkOptions.jvmArgs == null) {
            options.forkOptions.jvmArgs = []
        }
        options.forkOptions.jvmArgs.add(("-Dorg.sqlite.tmpdir=" + sqliteTmpDir.absolutePath).toString())
    }

    tasks.withType(Test).configureEach {
        systemProperty "org.sqlite.tmpdir", sqliteTmpDir.absolutePath.toString()
    }
}

// ทาสก์สำหรับล้างข้อมูลไฟล์ที่เกิดขึ้นระหว่างกระบวนการ build (Clean Build)
task clean(type: Delete) {
    delete rootProject.buildDir
}
