<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sankey-telemetry-title sankey-telemetry-desc">
      <title id="sankey-telemetry-title">ปริมาณข้อมูลโทรมาตรและการกระจายงานในระบบ</title>
      <desc id="sankey-telemetry-desc">Sankey diagram showing 10,000 req/s of sensor and external API telemetry splitting between in-memory cache and persistent storage, then serving live map layers, voice AI, and analytics, highlighting real-time map cache throughput.</desc>
