      <rect x="520" y="520" width="16" height="8" fill="#1e293b"/>
      <text x="544" y="528" fill="#475569" font-size="8.5" font-family="'Geist', 'Prompt', sans-serif">Node · ทราฟฟิกสะสมแต่ละส่วน</text>

      <text x="720" y="528" fill="#475569" font-size="8.5" font-family="'Geist', 'Prompt', sans-serif" font-style="italic">ทราฟฟิกแผนที่สดกว่า 75% รับข้อมูลตรงจาก In-Memory Cache</text>
