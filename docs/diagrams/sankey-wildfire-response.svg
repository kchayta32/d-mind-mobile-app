<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sankey-wildfire-title sankey-wildfire-desc">
      <title id="sankey-wildfire-title">การคัดกรองจุดความร้อนดาวเทียมสู่มาตรการดับไฟป่า</title>
      <desc id="sankey-wildfire-desc">Sankey diagram showing 1,200 daily satellite hotspots splitting by land classification and merging into response actions, highlighting critical forest wildfire response patrol dispatch.</desc>
  <defs>
    <style>
