      <rect x="230" y="520" width="16" height="8" fill="rgba(0,122,255,0.28)" stroke="#007aff" stroke-width="1"/>
      <text x="254" y="528" fill="#475569" font-size="8.5" font-family="'Geist', 'Prompt', sans-serif">Critical Wildfire · ภารกิจเร่งด่วนป่าอนุรักษ์</text>

      <rect x="490" y="520" width="16" height="8" fill="#1e293b"/>
      <text x="514" y="528" fill="#475569" font-size="8.5" font-family="'Geist', 'Prompt', sans-serif">Node · ยอดสะสมแต่ละระดับ</text>

      <text x="680" y="528" fill="#475569" font-size="8.5" font-family="'Geist', 'Prompt', sans-serif" font-style="italic">จุดความร้อนในป่าสงวนกว่า 81% (520 จุด) ถูกส่งต่อชุดดับไฟป่าทันที</text>
